name: Actualizar vídeos de YouTube

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    name: Leer vídeos publicados
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Consultar YouTube Data API
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_youtube.py

      - name: Comprobar archivo generado
        run: |
          if [ ! -f data/youtube-videos.json ]; then
            echo "ERROR: no se ha generado data/youtube-videos.json"
            exit 1
          fi

          python -m json.tool data/youtube-videos.json > /dev/null
          echo "El archivo JSON se ha generado correctamente."

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/youtube-videos.json

          if git diff --cached --quiet; then
            echo "No hay vídeos nuevos ni cambios que guardar."
          else
            git commit -m "Actualiza vídeos publicados en YouTube"
            git push
          fi